<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quote Generator  Client-Side Storage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Linked styles (handled by teammate) -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <main class="wrapper">

        <!-- Header -->
        <section class="panel">
            <h1> Daily Quote Generator</h1>
            <p>
                Quotes are fetched from an external API and personalized 
                theme preferences are saved using client-side storage.
            </p>
        </section>

        <!-- Theme Controls -->
        <section class="panel">
            <h2>Choose Theme</h2>
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="red">Red</button>
        </section>

        <!-- Quote Display -->
        <section class="panel">
            <h2>Quote</h2>
            <blockquote id="quote-text">Loading quote...</blockquote>
            <p id="quote-author"></p>
            <p id="status"></p>
        </section>
