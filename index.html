<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quote Generator  Client-Side Storage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Linked styles (handled by teammate) -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <main class="wrapper">

        <!-- Header -->
        <section class="panel">
            <h1> Daily Quote Generator</h1>
            <p>
                Quotes are fetched from an external API and personalized 
                theme preferences are saved using client-side storage.
            </p>
        </section>

        <!-- Theme Controls -->
        <section class="panel">
            <h2>Choose Theme</h2>
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="red">Red</button>
        </section>

        <!-- Quote Display -->
        <section class="panel">
            <h2>Quote</h2>
            <blockquote id="quote-text">Loading quote...</blockquote>
            <p id="quote-author"></p>
            <p id="status"></p>
        </section>

        <!-- Controls -->
        <section class="panel">
            <h2>Controls</h2>

            <button id="fetch-quote">Fetch New Quote</button>

            <div style="margin-top: 1rem;">
                <label for="interval-ms">
                    Auto Fetch Interval (milliseconds):
                </label>
                <input 
                    type="number" 
                    id="interval-ms" 
                    value="8000" 
                    min="1000"
                >
            </div>

            <div style="margin-top: 1rem;">
                <button id="auto-toggle">Start Auto</button>
                <button id="stop-auto" disabled>Stop Auto</button>
            </div>
        </section>

    </main>

    <!-- Linked script (handled by teammate) -->
    <script src="script.js"></script>
</body>
</html>
